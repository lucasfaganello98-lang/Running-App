<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plan Reprise Running - Strava Style</title>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #263349;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.25);
            --accent-secondary: #fc4c02; /* Orange Strava */
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 85px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Header & Global Progress */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            padding: 14px 0 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 18px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-pill {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
        }

        .progress-container {
            width: 100%;
            height: 9px;
            background-color: var(--bg-card);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fc4c02, var(--accent));
            border-radius: 999px;
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* Navigation Bottom Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(14px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: center;
            z-index: 150;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-inner {
            width: 100%;
            max-width: 480px;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 12px 8px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-btn.active {
            color: var(--accent);
        }

        .nav-icon {
            font-size: 1.2rem;
        }

        /* Views */
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }

        /* Week Cards */
        .week-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            transition: border-color 0.3s ease;
        }

        .week-card.goal-reached {
            border-color: rgba(16, 185, 129, 0.4);
        }

        .week-card.week-completed {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .week-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .week-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .week-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .badge {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.03em;
            display: none;
        }

        .badge.reached {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .badge.complete {
            display: inline-block;
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .timer-btn {
            background: rgba(252, 76, 2, 0.15);
            color: #ff7a45;
            border: 1px solid rgba(252, 76, 2, 0.4);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .timer-btn:active {
            transform: scale(0.95);
        }

        .workout-desc {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 14px;
            font-size: 0.9rem;
        }

        .workout-main {
            font-weight: 600;
            color: var(--text-primary);
        }

        .workout-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Run Checkboxes */
        .runs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .run-btn {
            background: var(--bg-primary);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 10px 6px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .run-btn.optional {
            border-style: dashed;
        }

        .run-btn:active {
            transform: scale(0.94);
        }

        .run-btn.checked {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--accent);
            border-style: solid;
            color: var(--text-primary);
        }

        .check-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .run-btn.checked .check-circle {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #064e3b;
        }

        .check-circle svg {
            width: 14px;
            height: 14px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease;
        }

        .run-btn.checked .check-circle svg {
            opacity: 1;
            transform: scale(1);
        }

        .opt-tag {
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Journal / History View */
        .summary-banner {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .stat-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
        }

        .stat-val {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent);
        }

        .stat-lbl {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .history-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .history-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .history-title {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .history-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .history-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .h-tag {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--text-primary);
        }

        .history-note {
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: rgba(15, 23, 42, 0.45);
            padding: 8px 10px;
            border-radius: 8px;
            font-style: italic;
        }

        .history-map {
            height: 160px;
            width: 100%;
            border-radius: 12px;
            margin-top: 10px;
            z-index: 1;
            border: 1px solid var(--border);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px dashed var(--border);
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
            max-height: 95vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 14px;
            right: 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* Timer & Strava Live GPS Modal */
        .timer-center {
            text-align: center;
        }

        .timer-week-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            padding-right: 30px;
        }

        .phase-badge {
            display: inline-block;
            margin: 8px 0 2px;
            padding: 5px 16px;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .phase-run {
            background: rgba(252, 76, 2, 0.2);
            color: #ff7a45;
            border: 1px solid var(--accent-secondary);
        }

        .phase-walk {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid var(--accent-secondary);
        }

        .phase-done {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid var(--warning);
        }

        .timer-display {
            font-size: 3.4rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
            margin: 2px 0;
        }

        .timer-rep {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        /* Strava Style Dashboard Grid (4 metrics) */
        .strava-metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .strava-box {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
        }

        .strava-val {
            font-size: 1.15rem;
            font-weight: 800;
            color: #f8fafc;
        }

        .strava-lbl {
            font-size: 0.68rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-top: 2px;
        }

        #live-map {
            height: 180px;
            width: 100%;
            border-radius: 12px;
            margin-bottom: 10px;
            z-index: 1;
            border: 1px solid var(--border);
        }

        .gps-status {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .timer-controls {
            display: flex;
            gap: 10px;
        }

        .ctrl-btn {
            flex: 1;
            padding: 13px;
            border-radius: 12px;
            border: none;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-start {
            background: var(--accent-secondary);
            color: #ffffff;
        }

        .btn-pause {
            background: var(--warning);
            color: #451a03;
        }

        .btn-reset-timer {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        /* Journal Entry Form Modal */
        .form-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 14px;
            padding-right: 28px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-input, .form-textarea {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .feeling-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .feeling-btn {
            background: var(--bg-primary);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 10px 4px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .feeling-btn.selected {
            border-color: var(--accent);
            background: rgba(16, 185, 129, 0.15);
            color: var(--text-primary);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .btn-danger-outline {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .footer-actions {
            margin-top: 24px;
            text-align: center;
        }

        .reset-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        #confetti-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 300;
        }
    </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="container">
    <header>
        <div class="header-top">
            <h1>🏃‍♂️ Reprise Running</h1>
            <div class="stats-pill" id="total-counter">0 / 12 séances</div>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="global-progress-bar"></div>
        </div>
        <div class="progress-label">
            <span id="motivation-text">C'est parti pour 4 semaines !</span>
            <span id="percent-text">0%</span>
        </div>
    </header>

    <!-- VUE 1 : PROGRAMME -->
    <div id="view-plan" class="view-section active">
        <main id="weeks-container"></main>
        <div class="footer-actions">
            <button class="reset-btn" onclick="resetAllProgress()">Réinitialiser tout le programme</button>
        </div>
    </div>

    <!-- VUE 2 : JOURNAL & HISTORIQUE -->
    <div id="view-journal" class="view-section">
        <div class="summary-banner">
            <div class="stat-box">
                <div class="stat-val" id="stat-total-runs">0</div>
                <div class="stat-lbl">Séances</div>
            </div>
            <div class="stat-box">
                <div class="stat-val" id="stat-total-km">0.0 km</div>
                <div class="stat-lbl">Distance GPS</div>
            </div>
            <div class="stat-box">
                <div class="stat-val" id="stat-total-min">0 min</div>
                <div class="stat-lbl">Temps actif</div>
            </div>
        </div>
        <div id="journal-list"></div>
    </div>
</div>

<!-- Barre de navigation inférieure -->
<nav class="bottom-nav">
    <div class="nav-inner">
        <button class="nav-btn active" id="nav-plan" onclick="switchTab('plan')">
            <span class="nav-icon">📋</span>
            <span>Programme</span>
        </button>
        <button class="nav-btn" id="nav-journal" onclick="switchTab('journal')">
            <span class="nav-icon">📖</span>
            <span>Journal & Cartes</span>
        </button>
    </div>
</nav>

<!-- MODAL 1 : MINUTEUR FRACTIONNÉ + GPS STRAVA STYLE -->
<div class="modal-overlay" id="timer-modal">
    <div class="modal-box timer-center">
        <button class="close-modal" onclick="closeTimer()">✕</button>
        <div class="timer-week-label" id="modal-week-title">Semaine 1</div>
        <div class="phase-badge phase-run" id="modal-phase">COURSE</div>
        <div class="timer-display" id="modal-time">01:00</div>
        <div class="timer-rep" id="modal-rep">Répétition 1 / 8</div>

        <!-- Dashboard Strava Style : 4 métriques -->
        <div class="strava-metrics-grid">
            <div class="strava-box">
                <div class="strava-val" id="strava-dist">0.00 km</div>
                <div class="strava-lbl">Distance</div>
            </div>
            <div class="strava-box">
                <div class="strava-val" id="strava-pace">--'--"/km</div>
                <div class="strava-lbl">Allure</div>
            </div>
            <div class="strava-box">
                <div class="strava-val" id="strava-speed">0.0 km/h</div>
                <div class="strava-lbl">Vitesse</div>
            </div>
            <div class="strava-box">
                <div class="strava-val" id="strava-chrono">00:00</div>
                <div class="strava-lbl">Temps total</div>
            </div>
        </div>

        <!-- Carte GPS active -->
        <div id="live-map"></div>
        <div class="gps-status" id="gps-status-text">🛰️ Initialisation du GPS haute précision...</div>

        <div class="timer-controls">
            <button class="ctrl-btn btn-start" id="modal-toggle-btn" onclick="toggleTimer()">Démarrer</button>
            <button class="ctrl-btn btn-reset-timer" onclick="resetTimer()">Reset</button>
        </div>
    </div>
</div>

<!-- MODAL 2 : JOURNAL D'ENTRAÎNEMENT (FICHE SÉANCE) -->
<div class="modal-overlay" id="log-modal">
    <div class="modal-box">
        <button class="close-modal" onclick="closeLogModal()">✕</button>
        <div class="form-title" id="log-modal-title">Valider la séance</div>

        <div class="form-group">
            <label class="form-label">Date de la sortie</label>
            <input type="date" id="log-date" class="form-input">
        </div>

        <div class="form-group">
            <label class="form-label">Ressenti physique</label>
            <div class="feeling-grid">
                <button type="button" class="feeling-btn" data-val="Facile" onclick="selectFeeling('Facile')">
                    <span style="font-size:1.3rem;">😊</span>
                    <span>Facile</span>
                </button>
                <button type="button" class="feeling-btn selected" data-val="Moyen" onclick="selectFeeling('Moyen')">
                    <span style="font-size:1.3rem;">😐</span>
                    <span>Moyen</span>
                </button>
                <button type="button" class="feeling-btn" data-val="Difficile" onclick="selectFeeling('Difficile')">
                    <span style="font-size:1.3rem;">🥵</span>
                    <span>Difficile</span>
                </button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Distance parcourue (km)</label>
            <input type="number" step="0.01" id="log-distance" class="form-input" placeholder="Ex: 3.45">
        </div>

        <div class="form-group">
            <label class="form-label">Notes & sensations</label>
            <textarea id="log-notes" rows="2" class="form-textarea" placeholder="Souffle, jambes, météo, parcours..."></textarea>
        </div>

        <div class="form-actions">
            <button type="button" class="btn-danger-outline" id="log-delete-btn" onclick="uncheckRun()" style="display:none;">Décocher</button>
            <button type="button" class="ctrl-btn btn-start" onclick="saveRunLog()">Enregistrer</button>
        </div>
    </div>
</div>

<script>
    const PLAN_DATA = [
        {
            week: 1,
            title: "Semaine 1",
            summary: "(1 min course / 2 min marche) × 8",
            meta: "2 à 3 séances • Total : ~24 min",
            totalMinutes: 24,
            runSec: 60,
            walkSec: 120,
            reps: 8
        },
        {
            week: 2,
            title: "Semaine 2",
            summary: "(2 min course / 2 min marche) × 7",
            meta: "2 à 3 séances • Total : ~28 min",
            totalMinutes: 28,
            runSec: 120,
            walkSec: 120,
            reps: 7
        },
        {
            week: 3,
            title: "Semaine 3",
            summary: "(3 min course / 1 min marche) × 6",
            meta: "2 à 3 séances • Total : ~24 min de course pure",
            totalMinutes: 24,
            runSec: 180,
            walkSec: 60,
            reps: 6
        },
        {
            week: 4,
            title: "Semaine 4",
            summary: "(5 min course / 1 min marche) × 4",
            meta: "2 à 3 séances • Total : 20 min de course continue",
            totalMinutes: 24,
            runSec: 300,
            walkSec: 60,
            reps: 4
        }
    ];

    const STORAGE_KEY = 'running_reprise_strava_v4';
    let progress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        1: [null, null, null],
        2: [null, null, null],
        3: [null, null, null],
        4: [null, null, null]
    };

    function saveStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    }

    function switchTab(tab) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

        document.getElementById(`view-${tab}`).classList.add('active');
        document.getElementById(`nav-${tab}`).classList.add('active');

        if (tab === 'journal') {
            renderJournal();
        }
    }

    function getMotivationMessage(count) {
        if (count === 0) return "Prêt pour ta première sortie ?";
        if (count < 3) return "Beau démarrage, garde le rythme !";
        if (count < 6) return "La régularité paie déjà !";
        if (count < 9) return "Plus de la moitié accomplie 💪";
        if (count < 12) return "Dernière ligne droite, lâche rien !";
        return "Programme terminé ! Bravo champion 🏆";
    }

    function renderPlan() {
        const container = document.getElementById('weeks-container');
        container.innerHTML = '';
        let totalChecked = 0;

        PLAN_DATA.forEach(item => {
            const weekRuns = progress[item.week];
            const checkedCount = weekRuns.filter(r => r !== null).length;
            totalChecked += checkedCount;

            const isGoalReached = checkedCount === 2;
            const isComplete = checkedCount === 3;

            const card = document.createElement('section');
            card.className = `week-card ${isGoalReached ? 'goal-reached' : ''} ${isComplete ? 'week-completed' : ''}`;

            let badgeHTML = '';
            if (isComplete) {
                badgeHTML = `<span class="badge complete">Semaine complète !</span>`;
            } else if (isGoalReached) {
                badgeHTML = `<span class="badge reached">Objectif atteint</span>`;
            }

            card.innerHTML = `
                <div class="week-header">
                    <div class="week-title-group">
                        <h2 class="week-title">${item.title}</h2>
                        ${badgeHTML}
                    </div>
                    <button class="timer-btn" onclick="openTimer(${item.week})">
                        ⏱️ Chrono Strava
                    </button>
                </div>
                <div class="workout-desc">
                    <div class="workout-main">${item.summary}</div>
                    <div class="workout-meta">${item.meta}</div>
                </div>
                <div class="runs-grid">
                    ${weekRuns.map((runData, idx) => {
                        const isChecked = runData !== null;
                        const feelingEmoji = isChecked ? (runData.feeling === 'Facile' ? '😊' : runData.feeling === 'Difficile' ? '🥵' : '😐') : '';
                        return `
                        <button class="run-btn ${idx === 2 ? 'optional' : ''} ${isChecked ? 'checked' : ''}" 
                                onclick="openLogModal(${item.week}, ${idx})">
                            <div class="check-circle">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                            <span>Séance ${idx + 1} ${feelingEmoji}</span>
                            <span class="opt-tag">${isChecked ? runData.date.slice(5).split('-').reverse().join('/') : (idx === 2 ? '(Bonus)' : 'Objectif')}</span>
                        </button>
                    `}).join('')}
                </div>
            `;
            container.appendChild(card);
        });

        const pct = Math.round((totalChecked / 12) * 100);
        document.getElementById('total-counter').textContent = `${totalChecked} / 12 séances`;
        document.getElementById('global-progress-bar').style.width = `${pct}%`;
        document.getElementById('percent-text').textContent = `${pct}%`;
        document.getElementById('motivation-text').textContent = getMotivationMessage(totalChecked);
    }

    /* --- JOURNAL & HISTORIQUE --- */
    let historyMaps = [];

    function renderJournal() {
        const listEl = document.getElementById('journal-list');
        listEl.innerHTML = '';
        historyMaps.forEach(m => m.remove());
        historyMaps = [];

        let entries = [];
        let totalKm = 0;
        let totalMin = 0;

        PLAN_DATA.forEach(w => {
            progress[w.week].forEach((run, idx) => {
                if (run) {
                    entries.push({
                        week: w.week,
                        weekTitle: w.title,
                        summary: w.summary,
                        runNum: idx + 1,
                        ...run
                    });
                    totalKm += parseFloat(run.distance || 0);
                    totalMin += w.totalMinutes;
                }
            });
        });

        entries.sort((a, b) => new Date(b.date) - new Date(a.date));

        document.getElementById('stat-total-runs').textContent = entries.length;
        document.getElementById('stat-total-km').textContent = `${totalKm.toFixed(2)} km`;
        document.getElementById('stat-total-min').textContent = `${totalMin} min`;

        if (entries.length === 0) {
            listEl.innerHTML = `
                <div class="empty-state">
                    <div style="font-size:2rem; margin-bottom:8px;">👟</div>
                    <p>Aucune séance enregistrée pour l'instant.</p>
                    <p style="font-size:0.8rem; margin-top:4px;">Lance le chrono Strava ou coche une séance pour remplir ton journal !</p>
                </div>
            `;
            return;
        }

        entries.forEach((entry, index) => {
            const card = document.createElement('div');
            card.className = 'history-card';
            const mapId = `hist-map-${index}`;
            const hasRoute = entry.route && entry.route.length > 1;
            const feelingEmoji = entry.feeling === 'Facile' ? '😊' : entry.feeling === 'Difficile' ? '🥵' : '😐';

            card.innerHTML = `
                <div class="history-top">
                    <div class="history-title">${entry.weekTitle} • Séance ${entry.runNum}</div>
                    <div class="history-date">${entry.date.split('-').reverse().join('/')}</div>
                </div>
                <div class="history-tags">
                    <span class="h-tag">${feelingEmoji} ${entry.feeling}</span>
                    ${entry.distance ? `<span class="h-tag">📍 ${parseFloat(entry.distance).toFixed(2)} km</span>` : ''}
                    <span class="h-tag">⏱️ ${entry.summary}</span>
                </div>
                ${entry.notes ? `<div class="history-note">"${entry.notes}"</div>` : ''}
                ${hasRoute ? `<div id="${mapId}" class="history-map"></div>` : ''}
            `;
            listEl.appendChild(card);

            if (hasRoute && typeof L !== 'undefined') {
                setTimeout(() => {
                    const map = L.map(mapId, { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false });
                    // Utilisation de la carte détaillée OpenStreetMap (rues, bâtiments)
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: ''
                    }).addTo(map);
                    const polyline = L.polyline(entry.route, { color: '#fc4c02', weight: 4.5, opacity: 0.95 }).addTo(map);
                    map.fitBounds(polyline.getBounds(), { padding: [15, 15] });
                    historyMaps.push(map);
                }, 50);
            }
        });
    }

    /* --- FICHE SÉANCE (LOG MODAL) --- */
    let currentEdit = { week: null, runIdx: null, selectedFeeling: 'Moyen', pendingRoute: null };

    function openLogModal(week, runIdx, prefillData = null) {
        currentEdit.week = week;
        currentEdit.runIdx = runIdx;
        const existing = progress[week][runIdx];

        document.getElementById('log-modal-title').textContent = `Semaine ${week} • Séance ${runIdx + 1}`;
        document.getElementById('log-delete-btn').style.display = existing ? 'block' : 'none';

        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('log-date').value = prefillData?.date || existing?.date || todayStr;
        document.getElementById('log-distance').value = prefillData?.distance || existing?.distance || '';
        document.getElementById('log-notes').value = prefillData?.notes || existing?.notes || '';
        currentEdit.pendingRoute = prefillData?.route || existing?.route || null;

        selectFeeling(prefillData?.feeling || existing?.feeling || 'Moyen');
        document.getElementById('log-modal').classList.add('active');
    }

    function closeLogModal() {
        document.getElementById('log-modal').classList.remove('active');
    }

    function selectFeeling(val) {
        currentEdit.selectedFeeling = val;
        document.querySelectorAll('.feeling-btn').forEach(btn => {
            btn.classList.toggle('selected', btn.dataset.val === val);
        });
    }

    function saveRunLog() {
        const { week, runIdx, selectedFeeling, pendingRoute } = currentEdit;
        const wasComplete = progress[week].filter(Boolean).length === 3;

        progress[week][runIdx] = {
            date: document.getElementById('log-date').value || new Date().toISOString().split('T')[0],
            feeling: selectedFeeling,
            distance: document.getElementById('log-distance').value,
            notes: document.getElementById('log-notes').value.trim(),
            route: pendingRoute
        };

        const isNowComplete = progress[week].filter(Boolean).length === 3;
        saveStorage();
        closeLogModal();
        renderPlan();

        if (!wasComplete && isNowComplete) {
            launchConfetti();
        }
    }

    function uncheckRun() {
        const { week, runIdx } = currentEdit;
        progress[week][runIdx] = null;
        saveStorage();
        closeLogModal();
        renderPlan();
    }

    function resetAllProgress() {
        if (confirm("Veux-tu vraiment effacer tout ton historique et tes séances ?")) {
            progress = {
                1: [null, null, null],
                2: [null, null, null],
                3: [null, null, null],
                4: [null, null, null]
            };
            saveStorage();
            renderPlan();
        }
    }

    /* --- MINUTEUR FRACTIONNÉ + STRAVA LIVE GPS --- */
    let timerState = {
        weekData: null,
        currentRep: 1,
        isRunPhase: true,
        secondsLeft: 60,
        elapsedTotalSec: 0,
        intervalId: null,
        isRunning: false
    };

    let gpsState = {
        watchId: null,
        coords: [], // [[lat, lng], ...]
        distanceKm: 0,
        map: null,
        polyline: null,
        marker: null
    };

    function calcDistanceKm(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function startGPSTracking() {
        if (!("geolocation" in navigator)) {
            document.getElementById('gps-status-text').textContent = "❌ GPS non supporté par le navigateur.";
            return;
        }
        document.getElementById('gps-status-text').textContent = "🛰️ Recherche signal GPS précis...";

        if (!gpsState.map && typeof L !== 'undefined') {
            gpsState.map = L.map('live-map', { zoomControl: false, attributionControl: false }).setView([46.603354, 1.888334], 5);
            // Utilisation des tuiles OpenStreetMap détaillées (rues, bâtiments, maisons visibles)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: ''
            }).addTo(gpsState.map);
            // Tracé style Strava (Orange vif)
            gpsState.polyline = L.polyline([], { color: '#fc4c02', weight: 4.5, opacity: 0.95 }).addTo(gpsState.map);
        }
        setTimeout(() => gpsState.map && gpsState.map.invalidateSize(), 100);

        gpsState.watchId = navigator.geolocation.watchPosition(
            (pos) => {
                const { latitude, longitude, accuracy } = pos.coords;
                document.getElementById('gps-status-text').textContent = `🛰️ GPS Actif (±${Math.round(accuracy)}m)`;

                const newPt = [latitude, longitude];
                if (gpsState.map) {
                    if (!gpsState.marker) {
                        gpsState.marker = L.circleMarker(newPt, { radius: 8, color: '#ffffff', fillColor: '#fc4c02', fillOpacity: 1, weight: 2 }).addTo(gpsState.map);
                        gpsState.map.setView(newPt, 17);
                    } else {
                        gpsState.marker.setLatLng(newPt);
                        gpsState.map.panTo(newPt);
                    }
                }

                if (timerState.isRunning && accuracy <= 40) {
                    if (gpsState.coords.length > 0) {
                        const prev = gpsState.coords[gpsState.coords.length - 1];
                        const d = calcDistanceKm(prev[0], prev[1], latitude, longitude);
                        if (d > 0.002) { // filtre micro-bruit (> 2 mètres)
                            gpsState.distanceKm += d;
                            gpsState.coords.push(newPt);
                            if (gpsState.polyline) gpsState.polyline.setLatLngs(gpsState.coords);
                        }
                    } else {
                        gpsState.coords.push(newPt);
                        if (gpsState.polyline) gpsState.polyline.setLatLngs(gpsState.coords);
                    }
                    updateStravaMetricsUI();
                }
            },
            (err) => {
                document.getElementById('gps-status-text').textContent = "⚠️ Erreur GPS. Vérifie l'accès localisation.";
            },
            { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
        );
    }

    function stopGPSTracking() {
        if (gpsState.watchId !== null) {
            navigator.geolocation.clearWatch(gpsState.watchId);
            gpsState.watchId = null;
        }
    }

    function resetGPSData() {
        gpsState.coords = [];
        gpsState.distanceKm = 0;
        if (gpsState.polyline) gpsState.polyline.setLatLngs([]);
        if (gpsState.marker && gpsState.map) {
            gpsState.map.removeLayer(gpsState.marker);
            gpsState.marker = null;
        }
        updateStravaMetricsUI();
    }

    function updateStravaMetricsUI() {
        document.getElementById('strava-dist').textContent = `${gpsState.distanceKm.toFixed(2)} km`;
        document.getElementById('strava-chrono').textContent = formatTime(timerState.elapsedTotalSec);

        let speedKmh = 0;
        if (timerState.elapsedTotalSec > 5 && gpsState.distanceKm > 0) {
            speedKmh = (gpsState.distanceKm / (timerState.elapsedTotalSec / 3600));
        }
        document.getElementById('strava-speed').textContent = `${speedKmh.toFixed(1)} km/h`;

        if (gpsState.distanceKm > 0.04 && timerState.elapsedTotalSec > 10) {
            const paceMinPerKm = (timerState.elapsedTotalSec / 60) / gpsState.distanceKm;
            const mins = Math.floor(paceMinPerKm);
            const secs = Math.round((paceMinPerKm - mins) * 60).toString().padStart(2, '0');
            document.getElementById('strava-pace').textContent = `${mins}'${secs}"/km`;
        } else {
            document.getElementById('strava-pace').textContent = `--'--"/km`;
        }
    }

    /* --- ALERTES AUDIO & VIBRATION (Fin de phase) --- */
    function triggerAlertSoundAndVibration(isTransitionToRun) {
        if (navigator.vibrate) {
            navigator.vibrate([300, 150, 300, 150, 400]);
        }

        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;
            const freq = isTransitionToRun ? 880 : 523.25;
            
            for (let i = 0; i < 3; i++) {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq + (i * 150), now + (i * 0.15));
                
                gain.gain.setValueAtTime(0.2, now + (i * 0.15));
                gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.15) + 0.12);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start(now + (i * 0.15));
                osc.stop(now + (i * 0.15) + 0.12);
            }
        } catch (e) {}
    }

    function formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateTimerUI() {
        const { weekData, currentRep, isRunPhase, secondsLeft, isRunning } = timerState;
        document.getElementById('modal-week-title').textContent = `${weekData.title} • ${weekData.summary}`;
        document.getElementById('modal-time').textContent = formatTime(secondsLeft);
        document.getElementById('modal-rep').textContent = `Répétition ${currentRep} / ${weekData.reps}`;

        const phaseEl = document.getElementById('modal-phase');
        if (secondsLeft === 0 && currentRep === weekData.reps && !isRunPhase) {
            phaseEl.textContent = "TERMINÉ ! 🎉";
            phaseEl.className = "phase-badge phase-done";
        } else if (isRunPhase) {
            phaseEl.textContent = "🏃‍♂️ COURSE";
            phaseEl.className = "phase-badge phase-run";
        } else {
            phaseEl.textContent = "🚶‍♂️ MARCHE";
            phaseEl.className = "phase-badge phase-walk";
        }

        const toggleBtn = document.getElementById('modal-toggle-btn');
        toggleBtn.textContent = isRunning ? "Pause" : "Démarrer";
        toggleBtn.className = `ctrl-btn ${isRunning ? 'btn-pause' : 'btn-start'}`;
    }

    function openTimer(weekNum) {
        const data = PLAN_DATA.find(w => w.week === weekNum);
        timerState.weekData = data;
        resetTimer();
        document.getElementById('timer-modal').classList.add('active');
        startGPSTracking();
    }

    function closeTimer() {
        clearInterval(timerState.intervalId);
        timerState.isRunning = false;
        stopGPSTracking();
        document.getElementById('timer-modal').classList.remove('active');
    }

    function resetTimer() {
        clearInterval(timerState.intervalId);
        timerState.isRunning = false;
        timerState.currentRep = 1;
        timerState.isRunPhase = true;
        timerState.secondsLeft = timerState.weekData.runSec;
        timerState.elapsedTotalSec = 0;
        resetGPSData();
        updateTimerUI();
    }

    function toggleTimer() {
        if (timerState.isRunning) {
            clearInterval(timerState.intervalId);
            timerState.isRunning = false;
            updateTimerUI();
            return;
        }

        timerState.isRunning = true;
        updateTimerUI();

        timerState.intervalId = setInterval(() => {
            timerState.elapsedTotalSec++;
            updateStravaMetricsUI();

            if (timerState.secondsLeft > 1) {
                timerState.secondsLeft--;
                updateTimerUI();
            } else {
                if (timerState.isRunPhase) {
                    timerState.isRunPhase = false;
                    timerState.secondsLeft = timerState.weekData.walkSec;
                    triggerAlertSoundAndVibration(false);
                } else {
                    if (timerState.currentRep < timerState.weekData.reps) {
                        timerState.currentRep++;
                        timerState.isRunPhase = true;
                        timerState.secondsLeft = timerState.weekData.runSec;
                        triggerAlertSoundAndVibration(true);
                    } else {
                        timerState.secondsLeft = 0;
                        clearInterval(timerState.intervalId);
                        timerState.isRunning = false;
                        triggerAlertSoundAndVibration(true);
                        updateTimerUI();
                        launchConfetti();

                        const weekNum = timerState.weekData.week;
                        const nextFreeIdx = progress[weekNum].findIndex(r => r === null);
                        if (nextFreeIdx !== -1) {
                            const recordedDist = gpsState.distanceKm > 0 ? gpsState.distanceKm.toFixed(2) : '';
                            const recordedRoute = gpsState.coords.length > 1 ? [...gpsState.coords] : null;
                            setTimeout(() => {
                                closeTimer();
                                openLogModal(weekNum, nextFreeIdx, {
                                    distance: recordedDist,
                                    route: recordedRoute
                                });
                            }, 1500);
                        }
                        return;
                    }
                }
                updateTimerUI();
            }
        }, 1000);
    }

    /* --- CONFETTIS --- */
    function launchConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = Array.from({ length: 70 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            r: Math.random() * 6 + 4,
            d: Math.random() * 4 + 2,
            color: ['#fc4c02', '#10b981', '#3b82f6', '#f59e0b', '#34d399']
        }));

        let frame = 0;
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.y += p.d;
                p.x += Math.sin(frame * 0.05) * 1.5;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            });
            frame++;
            if (frame < 130) {
                requestAnimationFrame(animate);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
        animate();
    }

    renderPlan();
</script>
</body>
